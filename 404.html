<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f6f6f6;
      color: #141414;
    }

    .box {
      width: min(560px, 92vw);
      background: #fff;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 24px;
      text-align: center;
    }

    a {
      color: #141414;
      font-weight: 600;
    }
  </style>
  <script>
    (function () {
      var path = window.location.pathname.split("/").pop();
      var map = {
        "article-bitcoin-dca-playbook.html": "article.html?id=bitcoin-weekly-budget",
        "article-web3-wallet-onboarding.html": "article.html?id=first-crypto-wallet",
        "article-ai-copilot-internal-tools.html": "article.html?id=ai-for-daily-work",
        "article-bitcoin-risk-management.html": "article.html?id=bitcoin-without-stress",
        "article-token-gated-community-features.html": "article.html?id=token-gating-simple",
        "article-rag-product-knowledge-bases.html": "article.html?id=why-ai-wrong"
      };

      var target = map[path];
      if (target) {
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body>
  <div class="box">
    <h1>Page not found</h1>
    <p>This page may have moved. Please open the blog page and choose an article.</p>
    <p><a href="blog.html">Go to Blog</a></p>
  </div>
</body>
</html>
